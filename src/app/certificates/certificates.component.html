<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6">
  <h2 class="text-xl font-bold text-slate-800 border-b-2 border-indigo-500 pb-2 flex items-center gap-2">
    📜 Certificates
  </h2>

  <div class="space-y-4">
    <div *ngFor="let cert of certificatesList" class="p-4 bg-slate-50 rounded-lg border border-slate-100 space-y-1">
      <h3 class="font-bold text-slate-900 text-base">{{ cert.title }}</h3>
      <p class="text-sm text-indigo-600 font-medium">{{ cert.issuer }}</p>
      <span class="text-xs text-slate-500 block">{{ cert.issueDate }}</span>
    </div>
  </div>
</div>
