<!-- Contenedor principal de la sección con un fondo sutil y bordes redondeados -->
<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6">
  
  <!-- Título principal de la sección con un subrayado elegante -->
  <h2 class="text-xl font-bold text-slate-800 border-b-2 border-indigo-500 pb-2 flex items-center gap-2">
    💼 Work Experience
  </h2>

  <!-- Lista que recorre tus datos de Firebase -->
  <div class="space-y-6">
    <div *ngFor="let job of workExperience" class="relative pl-4 border-l-2 border-indigo-300 space-y-2">
      
      <!-- Fechas y Ubicación (Línea superior) -->
      <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center text-xs sm:text-sm text-slate-500 font-medium">
        <span>{{ job.startDate }} - {{ job.endDate }}</span>
        <span class="italic text-slate-600 font-semibold">{{ job.location }}</span>
      </div>

      <!-- Puesto -->
      <h3 class="text-base sm:text-lg font-bold text-slate-900">
        {{ job.position }}
      </h3>

      <!-- Empresa -->
      <h4 class="text-sm font-semibold text-indigo-600">
        {{ job.company }}
      </h4>

      <!-- Logros / Accomplishments (Con un bloque estético para que resalte) -->
      <div class="mt-2 bg-slate-50 p-3 rounded-lg border border-slate-100 text-sm text-slate-700">
        <span class="font-bold text-slate-800 block mb-1">Logros:</span>
        <p class="leading-relaxed">{{ job.accomplishment }}</p>
      </div>

    </div>
  </div>

</div>
