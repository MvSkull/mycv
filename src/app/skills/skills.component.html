<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6">
  
  <!-- Título principal de la sección -->
  <h2 class="text-xl font-bold text-slate-800 border-b-2 border-indigo-500 pb-2 flex items-center gap-2">
    ⚡ Skills
  </h2>

  <!-- Recorre cada categoría agrupada automáticamente -->
  <div class="space-y-4" *ngFor="let category of categories">
    
    <!-- Nombre de la categoría (Ej: Frontend, Backend, etc.) -->
    <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-600 border-b border-slate-100 pb-1">
      {{ category }}
    </h3>

    <!-- Contenedor de las habilidades de esta categoría -->
    <div class="flex flex-wrap gap-2">
      <div *ngFor="let skill of groupedSkills[category]" 
           class="bg-slate-50 text-slate-700 text-xs sm:text-sm font-medium px-3 py-2 rounded-lg border border-slate-200 flex items-center gap-2 shadow-sm">
        
        <!-- Nombre de la skill -->
        <span class="font-bold text-slate-900">{{ skill.name }}</span>
        
        <!-- Nivel de la skill (con un estilo de badge sutil) -->
        <span class="bg-indigo-100 text-indigo-700 text-[10px] font-semibold px-2 py-0.5 rounded-full">
          {{ skill.level }}
        </span>

      </div>
    </div>

  </div>

</div>
